[project]
name = "ha-bgw320"
version = "0.2.1"
description = "Home Assistant custom integration for read-only AT&T BGW210/BGW320 gateway telemetry"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
ignore_missing_imports = true
